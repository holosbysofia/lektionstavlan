<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lektionstavlan</title>
<style>
:root{--ink:#173342;--muted:#617984;--bg:#f3f7f6;--teal:#187c80;--soft:#e1f2ef;--gold:#f5c96c;--line:#dce7e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-weight:bold}
header{background:white;border-bottom:1px solid var(--line);padding:15px 3%;display:flex;align-items:center;justify-content:space-between;gap:15px}
header h1{margin:0;font-size:24px}
header small{color:var(--muted)}
main{max-width:1350px;margin:auto;padding:22px 3%}
button.primary{background:var(--teal);color:white}
button.soft{background:var(--soft);color:var(--teal)}
button.light{background:white;border:1px solid var(--line);color:var(--ink)}
.weekbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.weekbar input{padding:9px;border:1px solid var(--line);border-radius:9px;background:white}
.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}
.panel,.lessonview{background:white;border:1px solid var(--line);border-radius:18px;padding:20px}
.panel h2,.lessonview h2{margin:0 0 13px}
.lessonlist{display:grid;gap:8px}
.lessonitem{background:#f7f9f8;border:1px solid var(--line);padding:12px;border-radius:12px;text-align:left;color:var(--ink)}
.lessonitem.selected{background:var(--soft);border-color:var(--teal)}
.lessonitem small{display:block;color:var(--muted);margin-top:4px}
.lessonview{min-height:580px}
.viewhead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.viewhead h2{font-size:32px;margin:0 0 6px}
.dateLine{color:var(--muted);margin-bottom:18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prompt{padding:16px;border-radius:14px;background:#f5f8f7;min-height:112px}
.prompt.goal{background:var(--soft);grid-column:1/-1}
.prompt h3{margin:0 0 9px;font-size:16px;color:var(--teal)}
.prompt p{margin:0;white-space:pre-wrap;line-height:1.45;font-size:18px}
.timer{margin-top:16px;padding:14px;background:#fff8e8;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#time{font-size:34px;font-weight:bold;font-variant-numeric:tabular-nums}
#congrats{text-align:center;color:var(--teal);font-size:22px;font-weight:bold;margin-top:16px}
.empty{color:var(--muted);line-height:1.5}
dialog{border:0;border-radius:18px;padding:22px;width:min(600px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#102c3677}
form{display:grid;gap:11px}
form label{font-weight:bold}
form input,form textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:9px}
form textarea{min-height:65px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.lessonview{min-height:0}}
@media(max-width:560px){.cards{grid-template-columns:1fr}.prompt.goal{grid-column:auto}.viewhead{display:block}}
body.projector header,body.projector .weekbar,body.projector .panel{display:none}
body.projector main{max-width:none;padding:14px}
body.projector .layout{display:block}
body.projector .lessonview{min-height:90vh}
</style>
</head>
<body>
<header>
  <div><h1>Lektionstavlan</h1><small>Planera veckan och visa en lektion i taget</small></div>
  <button class="soft" id="fullBtn">⛶ Visa på smartboard</button>
</header>

<main>
  <div class="weekbar">
    <button class="light" id="prevWeek">← Föregående vecka</button>
    <label>Veckan börjar:
      <input type="date" id="weekDate">
    </label>
    <button class="light" id="nextWeek">Nästa vecka →</button>
    <button class="primary" id="addBtn">＋ Lägg till lektion</button>
  </div>

  <div class="layout">
    <aside class="panel">
      <h2>Veckans lektioner</h2>
      <div id="lessonList" class="lessonlist"></div>
    </aside>

    <section class="lessonview" id="lessonView"></section>
  </div>
</main>

<dialog id="lessonDialog">
  <form id="lessonForm">
    <h2>Lägg till lektion</h2>
    <label>Datum<input name="date" type="date" required></label>
    <label>Tid, om du vill<input name="time" type="time"></label>
    <label>Ämne och lektionsnamn<input name="title" placeholder="Till exempel Matematik – bråk" required></label>
    <label>Klass eller grupp<input name="group" placeholder="Till exempel 6A"></label>
    <label>Vad är dagens mål?<textarea name="goal"></textarea></label>
    <label>Vad gjorde vi sist?<textarea name="last"></textarea></label>
    <label>Vad ska jag göra nu?<textarea name="now"></textarea></label>
    <label>Hur ska jag göra?<textarea name="how"></textarea></label>
    <label>Vad gör jag sedan?<textarea name="next"></textarea></label>
    <label>Vad har jag lärt mig idag?<textarea name="learned"></textarea></label>
    <div class="actions">
      <button type="button" class="light" id="cancelBtn">Avbryt</button>
      <button class="primary" type="submit">Spara lektion</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const STORAGE = "lektionstavlan_weekplan_v1";
let lessons = JSON.parse(localStorage.getItem(STORAGE) || "[]");
let selectedId = null;
let timerHandle = null;
let seconds = 15 * 60;

function mondayOf(date){
  const d = new Date(date+"T12:00:00");
  const day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function changeWeek(amount){
  const d = new Date($("weekDate").value+"T12:00:00");
  d.setDate(d.getDate()+amount*7);
  $("weekDate").value = mondayOf(d.toISOString().slice(0,10));
  render();
}
function save(){localStorage.setItem(STORAGE,JSON.stringify(lessons))}
function currentWeekLessons(){
  const start = new Date($("weekDate").value+"T00:00:00");
  const end = new Date(start); end.setDate(end.getDate()+7);
  return lessons.filter(l=>{
    const d = new Date(l.date+"T12:00:00");
    return d>=start && d<end;
  }).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function niceDate(s){
  return new Date(s+"T12:00:00").toLocaleDateString("sv-SE",{
    weekday:"long",day:"numeric",month:"long"
  });
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function render(){
  const week = currentWeekLessons();
  if(!week.some(l=>l.id===selectedId)) selectedId = week[0]?.id || null;

  $("lessonList").innerHTML = week.length ? week.map(l=>`
    <button class="lessonitem ${l.id===selectedId?"selected":""}" data-id="${l.id}">
      ${escapeHtml(l.title)}
      <small>${niceDate(l.date)}${l.time?" · "+l.time:""}${l.group?" · "+escapeHtml(l.group):""}</small>
    </button>`).join("") : `<p class="empty">Inga lektioner inlagda för den här veckan ännu.<br><br>Klicka på <b>Lägg till lektion</b> för att börja.</p>`;

  document.querySelectorAll(".lessonitem").forEach(b=>{
    b.onclick=()=>{selectedId=b.dataset.id;render()};
  });

  const l=week.find(x=>x.id===selectedId);
  if(!l){
    $("lessonView").innerHTML=`<div class="empty"><h2>Välj eller lägg till en lektion</h2><p>När du väljer en lektion visas bara den lektionen här. Du kan lägga in hela veckan i listan.</p></div>`;
    return;
  }

  $("lessonView").innerHTML=`
    <div class="viewhead">
      <div><h2>${escapeHtml(l.title)}</h2>
      <div class="dateLine">${niceDate(l.date)} ${l.time?"· "+l.time:""} ${l.group?"· "+escapeHtml(l.group):""}</div></div>
      <button class="light" id="deleteBtn">Ta bort lektion</button>
    </div>
    <div class="cards">
      <div class="prompt goal"><h3>Vad är dagens mål?</h3><p>${escapeHtml(l.goal)||"—"}</p></div>
      <div class="prompt"><h3>Vad gjorde vi sist?</h3><p>${escapeHtml(l.last)||"—"}</p></div>
      <div class="prompt"><h3>Vad ska jag göra nu?</h3><p>${escapeHtml(l.now)||"—"}</p></div>
      <div class="prompt"><h3>Hur ska jag göra?</h3><p>${escapeHtml(l.how)||"—"}</p></div>
      <div class="prompt"><h3>Vad gör jag sedan?</h3><p>${escapeHtml(l.next)||"—"}</p></div>
      <div class="prompt"><h3>Vad har jag lärt mig idag?</h3><p>${escapeHtml(l.learned)||"—"}</p></div>
    </div>
    <div class="timer">
      <div><strong>Arbetstid</strong><br><span id="time">15:00</span></div>
      <div><button class="light" id="minus">− 1 min</button>
      <button class="primary" id="start">▶ Starta</button>
      <button class="light" id="reset">↻ Börja om</button>
      <button class="light" id="plus">＋ 1 min</button></div>
    </div>
    <div id="congrats">Bra jobbat!</div>`;

  $("deleteBtn").onclick=()=>{
    if(confirm("Vill du ta bort den här lektionen?")){
      lessons=lessons.filter(x=>x.id!==selectedId);selectedId=null;save();render();
    }
  };
  setupTimer();
}
function showTime(){
  const m=Math.floor(seconds/60),s=seconds%60;
  const el=document.getElementById("time");
  if(el) el.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function setupTimer(){
  seconds=15*60;showTime();
  $("start").onclick=()=>{
    if(timerHandle){clearInterval(timerHandle);timerHandle=null;$("start").textContent="▶ Fortsätt";return}
    $("start").textContent="Ⅱ Pausa";
    timerHandle=setInterval(()=>{
      seconds--;showTime();
      if(seconds<=0){clearInterval(timerHandle);timerHandle=null;alert("Tiden är slut!")}
    },1000);
  };
  $("reset").onclick=()=>{clearInterval(timerHandle);timerHandle=null;seconds=15*60;showTime();$("start").textContent="▶ Starta"};
  $("plus").onclick=()=>{seconds+=60;showTime()};
  $("minus").onclick=()=>{seconds=Math.max(0,seconds-60);showTime()};
}

$("addBtn").onclick=()=>{
  $("lessonForm").reset();
  $("lessonForm").elements.date.value=$("weekDate").value;
  $("lessonDialog").showModal();
};
$("cancelBtn").onclick=()=>$("lessonDialog").close();
$("lessonForm").onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const lesson={
    id:crypto.randomUUID(),
    date:f.get("date"),time:f.get("time"),title:f.get("title"),
    group:f.get("group"),goal:f.get("goal"),last:f.get("last"),
    now:f.get("now"),how:f.get("how"),next:f.get("next"),learned:f.get("learned")
  };
  lessons.push(lesson);selectedId=lesson.id;save();$("lessonDialog").close();render();
};
$("prevWeek").onclick=()=>changeWeek(-1);
$("nextWeek").onclick=()=>changeWeek(1);
$("weekDate").onchange=()=>{$("weekDate").value=mondayOf($("weekDate").value);render()};
$("fullBtn").onclick=()=>{
  document.body.classList.toggle("projector");
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement) document.body.classList.remove("projector");
});

const today=new Date();
$("weekDate").value=mondayOf(today.toISOString().slice(0,10));
render();
</script>
</body>
</html>
